<script>
(function () {
  var root = document.querySelector('[data-composition-id="05-incidents"]');
  var byId = function (id) { return root.querySelector('[id="' + id + '"]'); };
  var byCls = function (c) { return Array.prototype.slice.call(root.querySelectorAll('[class~="' + c + '"]')); };

  var world = byId("05-incidents-world");
  var eyebrow = byId("05-incidents-eyebrow");
  var tag = byId("05-incidents-tag");
  var h2 = byId("05-incidents-h2");
  var cards = byCls("05-incidents-card");
  var links = byCls("05-incidents-link");
  var arrows = byCls("05-incidents-arrow");
  var pill = byId("05-incidents-pill");
  var warn = byId("05-incidents-warn");
  var many = byId("05-incidents-many");

  // svg-path-draw setup: measured lengths
  links.concat(arrows).forEach(function (p) {
    var len = 0;
    try { len = p.getTotalLength(); } catch (e) { len = 0; }
    if (!len) len = 800;
    len = len * 1.05;
    p.style.strokeDasharray = len + "";
    p.style.strokeDashoffset = len + "";
  });

  var tl = gsap.timeline({ paused: true });

  // Underlying slow camera push across the whole shot
  tl.fromTo(world, { scale: 1 }, { scale: 1.025, duration: 16.152, ease: "none" }, 0);

  // Scene 1 — slide-header
  tl.fromTo(eyebrow, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 0.05);
  tl.fromTo(h2, { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 0.2);
  tl.fromTo(tag, { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.5, ease: "back.out(1.8)" }, 1.3);

  // Scene 2 — grid-card-assemble: each card drops into its slot on its spoken name
  var cardTimes = [2.1, 3.1, 4.1, 5.3, 6.4];
  cards.forEach(function (c, i) {
    tl.fromTo(c,
      { opacity: 0, y: -70, scale: 0.96 },
      { opacity: 1, y: 0, scale: 1, duration: 0.65, ease: "power3.out" },
      cardTimes[i]);
  });

  // Scene 3 — connectors converge into the arrow, then the process pill
  links.forEach(function (p, i) {
    tl.to(p, { strokeDashoffset: 0, duration: 0.6, ease: "power2.out" }, 8.4 + i * 0.12);
  });
  tl.to(arrows[0], { strokeDashoffset: 0, duration: 0.35, ease: "power2.out" }, 9.2);
  tl.to(arrows[1], { strokeDashoffset: 0, duration: 0.3, ease: "power2.out" }, 9.45);
  tl.fromTo(pill, { opacity: 0, scale: 0.7, y: 12 }, { opacity: 1, scale: 1, y: 0, duration: 0.55, ease: "back.out(1.7)" }, 10.1);

  // Scene 4 — depth-of-field: strip defocuses + dims, warning appears
  cards.forEach(function (c) {
    tl.to(c, { "--dof": "1px", opacity: 0.6, duration: 0.9, ease: "power2.inOut" }, 12.1);
  });
  tl.to(links, { opacity: 0.5, duration: 0.9, ease: "power2.inOut" }, 12.1);

  // warning line: "nhiều lần" holds at the line's size (scale 38/58) until its own beat
  var START_SCALE = 38 / 58;
  tl.set(many, { scale: START_SCALE }, 0);
  tl.fromTo(warn, { opacity: 0, y: 18, x: 50 }, { opacity: 1, y: 0, x: 50, duration: 0.6, ease: "power3.out" }, 13.3);

  // Scene 5 — counting-dynamic-scale (scale part only): "nhiều lần" grows to its static size
  tl.fromTo(many, { scale: START_SCALE }, { scale: 1, duration: 1.4, ease: "power3.out" }, 14.7);
  tl.fromTo(warn, { x: 50 }, { x: 0, duration: 1.4, ease: "power3.out", immediateRender: false }, 14.7);

  window.__timelines = window.__timelines || {};
  window.__timelines["05-incidents"] = tl;
})();
