<script>

    /* --- draw setup (measured lengths) --- */
    function prepDraw(el, fallback) {
      var len = fallback;
      try { var m = el.getTotalLength(); if (m && isFinite(m) && m > 0) len = m; } catch (e) {}
      len = len * 1.05;
      el.style.strokeDasharray = String(len);
      el.style.strokeDashoffset = String(len);

    var linkProd = byId("02-why-link-prod");
    var linkTrust = byId("02-why-link-trust");
