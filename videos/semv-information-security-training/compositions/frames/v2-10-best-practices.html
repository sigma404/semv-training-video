<script>
(function () {
  var FID = "v2-10-best-practices";
  var $ = function (id) { return document.getElementById(FID + "-" + id); };
  var cls = function (el, c) { return el.getElementsByClassName(FID + "-" + c); };
  var tl = gsap.timeline({ paused: true });

  // ---- Scene 1 (0.0–1.8s): slide-header --------------------------------
  tl.fromTo($("eyebrow"), { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" }, 0.05);
  tl.fromTo($("pill"), { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.5, ease: "power3.out" }, 0.35);
  // h2 lands on "bảy biện pháp" (0.9s)
  var words = cls($("h2"), "word");
  for (var w = 0; w < words.length; w++) {
    tl.fromTo(words[w], { opacity: 0, y: 34 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.9 + w * 0.06);
  }

  // empty 2-col grid region established: ghost slots stagger in
  var cueTimes = [1.9, 3.1, 4.2, 7.0, 8.7, 10.1, 11.7];
  for (var g = 0; g < 7; g++) {
    var ghost = cls($("slot" + (g + 1)), "ghost")[0];
    tl.fromTo(ghost, { opacity: 0, scale: 0.97 }, { opacity: 1, scale: 1, duration: 0.45, ease: "power2.out" }, 1.1 + g * 0.08);
    tl.to(ghost, { opacity: 0, duration: 0.3, ease: "power1.out" }, cueTimes[g] + 0.25);
  }

  // ---- Scene 2 (1.9–11.6s) + Scene 3 entrance: grid-card-assemble --------
  for (var i = 0; i < 7; i++) {
    var slot = $("slot" + (i + 1));
    var card = cls(slot, "card")[0];
    var num = cls(slot, "num")[0];
    var ico = cls(slot, "ico")[0];
    var label = cls(slot, "label")[0];
    var t = cueTimes[i];
    tl.fromTo(card, { opacity: 0, y: 36, scale: 0.96 }, { opacity: 1, y: 0, scale: 1, duration: 0.6, ease: "power3.out" }, t);
    tl.fromTo(num, { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.5, ease: "power3.out" }, t + 0.1);
    tl.fromTo(ico, { scale: 0.5, rotation: -12, opacity: 0 }, { scale: 1, rotation: 0, opacity: 1, duration: 0.55, ease: "power3.out" }, t + 0.16);
    tl.fromTo(label, { opacity: 0, x: -18 }, { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" }, t + 0.2);
  }

  // ---- Scene 3 (12.0s): card 7 floods solid blue on "khóa máy" -----------
  tl.fromTo($("sweep"), { scaleX: 0 }, { scaleX: 1, duration: 0.55, ease: "power2.inOut" }, 12.0);
  tl.fromTo($("card7"), { borderColor: "rgba(10, 61, 145, 0.2)" }, { borderColor: "rgba(10, 61, 145, 1)", duration: 0.4, ease: "power1.out" }, 12.05);

  tl.fromTo($("num7"), { backgroundColor: "#0A3D91", color: "#FFFFFF" }, { backgroundColor: "#FFFFFF", color: "#0A3D91", duration: 0.35, ease: "power1.out" }, 12.15);

  // ---- Hold: slow camera push-in under the assemble; Scene 4 near-still ---
  tl.fromTo($("stage"), { scale: 1 }, { scale: 1.015, duration: 16.28 - 1.9, ease: "none" }, 1.9);

  window.__timelines = window.__timelines || {};
  window.__timelines[FID] = tl;
})();
