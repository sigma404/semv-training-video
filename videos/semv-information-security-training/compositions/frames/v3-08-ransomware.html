      tl.fromTo(q("#v3-08-ransomware-eyebrow"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 0.0);
      tl.fromTo(q("#v3-08-ransomware-h2"), { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" }, 0.1);
      tl.fromTo(q("#v3-08-ransomware-pill"), { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 0.25);
      tl.fromTo(s1, { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.25);
      tl.fromTo(q("#v3-08-ransomware-arrow1"), { scaleY: 0, opacity: 0 }, { scaleY: 1, opacity: 1, duration: 0.4, ease: "power2.out" }, 0.55);
      tl.fromTo(card, { opacity: 0, y: 16 }, { opacity: 0.4, y: 0, duration: 0.55, ease: "power3.out" }, 1.3);

      /* sequence (spec exception): steps reveal in narration order, each spotlighted when spoken */
      // "mã hóa dữ liệu trên máy tính và server" -> steps 1 + 2 together
      tl.fromTo(s2, { y: 16 }, { y: 0, duration: 0.5, ease: "power3.out" }, CUE.enc);
      spot([s1, s2], [s1, s2], CUE.enc);
      var slots = qa(".v3-08-ransomware-slot");
      slots.forEach(function (slot, i) {
        tl.fromTo(slot, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, CUE.enc + 0.2 + i * 0.07);
      });
      // files flip into locks (icon graphic, not text)
      var files = qa(".v3-08-ransomware-file");
      var locks = qa(".v3-08-ransomware-lock");
      files.forEach(function (f, i) {
        var at = CUE.enc + 0.8 + i * 0.3;
        tl.fromTo(f, { rotationY: 0, opacity: 1 }, { rotationY: 90, opacity: 0, duration: 0.2, ease: "power2.in" }, at);
        tl.fromTo(locks[i], { rotationY: -90, opacity: 0 }, { rotationY: 0, opacity: 1, duration: 0.28, ease: "power2.out" }, at + 0.2);
      });
      // "đòi tiền chuộc" -> step 3
      tl.fromTo(q("#v3-08-ransomware-arrow2"), { scaleY: 0, opacity: 0 }, { scaleY: 1, opacity: 1, duration: 0.35, ease: "power2.out" }, CUE.ransom - 0.3);
      tl.fromTo(s3, { y: 16 }, { y: 0, duration: 0.5, ease: "power3.out" }, CUE.ransom);
      spot([s1, s2, s3], [s3], CUE.ransom);

      /* "Colonial Pipeline" -> the case card */
      spot([s1, s2, s3, card], [card], CUE.colonial);

      /* "năm triệu đô la" -> card ring hands over to the figure, which counts 0 -> 5 */
      calm([card], CUE.money);
      tl.fromTo(money, { y: 12 }, { y: 0, duration: 0.45, ease: "power2.out" }, CUE.money);
      spot([money], [money], CUE.money);
      var counterEl = q("#v3-08-ransomware-counter");
      var state = { value: 0 };
      tl.fromTo(state, { value: 0 }, {
        value: 5, duration: 0.8, ease: "power2.out",
        onUpdate: function () { counterEl.textContent = String(Math.round(state.value)); }
      }, CUE.money);

      /* "tương đương 114 tỷ đồng" */
      tl.fromTo(vnd, { y: 12 }, { y: 0, duration: 0.45, ease: "power2.out" }, CUE.vnd);
      spot([money, vnd], [vnd], CUE.vnd);

      /* "mà vận hành vẫn bị gián đoạn" -> red consequence note */
      tl.fromTo(alert, { y: 12 }, { y: 0, duration: 0.45, ease: "power2.out" }, CUE.alert);
      spot([money, vnd, alert], [alert], CUE.alert);

      /* rest: whole slide back for the hold; the payoff note keeps its spotlight */
      calm([s1, s2, s3, card, money, vnd], CUE.rest);

      tl.set({}, {}, DURATION);
      window.__timelines["v3-08-ransomware"] = tl;
    })();
  </script>
</template>
