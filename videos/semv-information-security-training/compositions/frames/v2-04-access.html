  // Scene 2: left card from the left (5.0s)
  tl.fromTo($(P + "wingL"),
    { opacity: 0, x: -280, rotationY: 9, scale: 0.9 },
    { opacity: 1, x: 0, rotationY: 0, scale: 1, duration: 1.0, ease: "expo.out" }, 5.0);
  tl.fromTo($(P + "badgeL"), { opacity: 0, scale: 0.5 }, { opacity: 1, scale: 1, duration: 0.55, ease: "back.out(2.2)" }, 5.35);
  tl.fromTo($(P + "adm-line"), { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 5.7);
  [["lvA", 6.9], ["lvB", 7.4], ["lvC", 8.0]].forEach(function (l) {
    tl.fromTo($(P + l[0]), { opacity: 0, y: 30, scale: 0.92 }, { opacity: 1, y: 0, scale: 1, duration: 0.5, ease: "power3.out" }, l[1]);
  });
  tl.fromTo($(P + "who"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 9.2);
  tl.fromTo($(P + "adm-sub"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 9.6);

  // Scene 3: right card from the right (10.7s) + ban rows
  tl.fromTo($(P + "wingR"),
    { opacity: 0, x: 280, rotationY: -9, scale: 0.9 },
    { opacity: 1, x: 0, rotationY: 0, scale: 1, duration: 1.0, ease: "expo.out" }, 10.7);
  tl.fromTo($(P + "badgeR"), { opacity: 0, scale: 0.5 }, { opacity: 1, scale: 1, duration: 0.55, ease: "back.out(2.2)" }, 11.0);

  [["ban1", 11.1], ["ban2", 12.2]].forEach(function (b) {
    var row = $(P + b[0]);
    var ring = row.querySelector(".v2-04-access-ban-ring");
    var slash = row.querySelector(".v2-04-access-ban-slash");
    var rLen = ring.getTotalLength ? ring.getTotalLength() : 60;
    var sLen = slash.getTotalLength ? slash.getTotalLength() : 19;
    tl.fromTo(row, { opacity: 0, x: 24 }, { opacity: 1, x: 0, duration: 0.45, ease: "power3.out" }, b[1]);
    tl.fromTo(ring, { strokeDasharray: rLen, strokeDashoffset: rLen }, { strokeDashoffset: 0, duration: 0.5, ease: "power2.out" }, b[1] + 0.1);
    tl.fromTo(slash, { strokeDasharray: sLen, strokeDashoffset: sLen }, { strokeDashoffset: 0, duration: 0.3, ease: "power2.out" }, b[1] + 0.45);
  });

  // ---------- Scene 4 (13.6–15.4s): rotation pill pops on "đổi mật khẩu" (13.8s) ----------
  tl.fromTo($(P + "rot"), { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.6, ease: "back.out(2)" }, 13.8);

  // ---------- Scene 5 (15.5–20.2s): password field types, ticks + stepped strength fill ----------
  tl.fromTo($(P + "input"), { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 15.1);
  tl.fromTo($(P + "meter"), { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 15.2);
  tl.fromTo($$(".v2-04-access-crit"), { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out", stagger: 0.04 }, 15.25);

  // discrete-text-sequence typing
  var typedEl = $(P + "typed");
  var caretEl = $(P + "caret");
  var PASS = "S•••••••@7k";
  var TYPE_START = 15.5, KEY_GAP = 0.09;
  var SEQ = [{ t: 0, text: "" }];
  for (var i = 1; i <= PASS.length; i++) SEQ.push({ t: TYPE_START + i * KEY_GAP, text: PASS.slice(0, i) });
  var TYPE_END = TYPE_START + PASS.length * KEY_GAP;
  function textAt(t) {
    for (var k = SEQ.length - 1; k >= 0; k--) if (t >= SEQ[k].t) return SEQ[k].text;
    return "";
  }
  var driver = { t: 0 };
  tl.fromTo(driver, { t: 0 }, {
    t: DUR, duration: DUR, ease: "none",
    onUpdate: function () { typedEl.textContent = textAt(driver.t); }
  }, 0);

  // caret: deterministic sin square wave, solid while typing
  var CARET_START = 15.1;
  var BLINK_DUR = DUR - CARET_START;
  var CYCLES = Math.round(BLINK_DUR / 0.7);
  var blink = { p: 0 };
  tl.fromTo(blink, { p: 0 }, {
    p: Math.PI * 2 * CYCLES, duration: BLINK_DUR, ease: "none",
    onUpdate: function () {
      var t = CARET_START + (blink.p / (Math.PI * 2 * CYCLES)) * BLINK_DUR;
      var typing = t < TYPE_END + 0.1;
      caretEl.style.opacity = (typing || Math.cos(blink.p) > 0) ? "1" : "0";
    }
  }, CARET_START);

  // ticks on their spoken cues, strength fill steps up with each (100% at 19.9s)
  var fill = $(P + "fill");
  tl.set(fill, { scaleX: 0 }, 0);
  var ticks = [
    ["c1", 15.7, 0.2, 0.4],
    ["c2", 17.1, 0.4, 0.4],
    ["c3", 17.9, 0.6, 0.4],
    ["c4", 18.6, 0.8, 0.4],
    ["c5", 19.7, 1.0, 0.2]
  ];
  var prev = 0;
  ticks.forEach(function (tk) {
    var row = $(P + tk[0]);
    var dot = row.querySelector(".v2-04-access-dot");
    var chk = row.querySelector(".v2-04-access-check");
    var cLen = chk.getTotalLength ? chk.getTotalLength() : 16;
    var at = tk[1];
    tl.fromTo(dot, { scale: 0, opacity: 0, transformOrigin: "50% 50%" }, { scale: 1, opacity: 1, transformOrigin: "50% 50%", duration: 0.3, ease: "back.out(2)" }, at - 0.05);
    tl.fromTo(chk, { strokeDasharray: cLen, strokeDashoffset: cLen }, { strokeDashoffset: 0, duration: 0.25, ease: "power2.out" }, at + 0.08);
    tl.fromTo(row.querySelector("span"), { color: "#9A9A9A" }, { color: "#0F172A", duration: 0.3, ease: "power1.out" }, at);
    tl.fromTo(fill, { scaleX: prev }, { scaleX: tk[2], duration: tk[3], ease: "power2.out", immediateRender: false }, at);
    prev = tk[2];
  });

  // ---------- low-amplitude phase-opposed idle float (left sin, right sin+π) ----------
  var floatL = $(P + "floatL"), floatR = $(P + "floatR");
  var fl = { p: 0 };
  var F_START = 6.0, F_DUR = DUR - F_START;
  tl.fromTo(fl, { p: 0 }, {
    p: F_DUR * 1.6, duration: F_DUR, ease: "none",
    onUpdate: function () {
      var ramp = Math.min(1, fl.p / 1.6);
      gsap.set(floatL, { y: 3 * ramp * Math.sin(fl.p) });
      var rp = Math.max(0, fl.p - 1.6 * (11.7 - F_START));
      var rRamp = Math.min(1, rp / 1.6);
      gsap.set(floatR, { y: 3 * rRamp * Math.sin(fl.p + Math.PI) });
    }
  }, F_START);

  // ---------- Scene 6 (20.2–22.2s): hold ----------
  tl.set({}, {}, DUR);

  window.__timelines[FID] = tl;
})();
</script>
</template>
