  (function () {

      var len = fallback;

      len = len * 1.05;
      el.style.strokeDasharray = String(len);
      el.style.strokeDashoffset = String(len);

      byId("v3-03-context-link-trust"), byId("v3-03-context-link-aware")
    ];

    prepDraw(links[0], Math.hypot(156, 95));
    prepDraw(links[1], Math.hypot(156, 95));
    prepDraw(links[2], Math.hypot(184, 35));
    prepDraw(links[3], Math.hypot(184, 35));

    /* --- A. calm slide reveal: header by ~0.8s, whole slide by ~2.0s --- */
    tl.fromTo("#v3-03-context-eyebrow", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 0.1);
    tl.fromTo("#v3-03-context-tag", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 0.2);
    tl.fromTo("#v3-03-context-title", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 0.3);

    // central SEMV hub: fill + outline draw, then steady

    tl.to(outline, { strokeDashoffset: 0, duration: 0.9, ease: "power2.out" }, 0.5);
    tl.fromTo(byId("v3-03-context-mark"), { opacity: 0, y: 2 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 1.0);

    var CARDS = ["#v3-03-context-card-leak", "#v3-03-context-card-prod", "#v3-03-context-card-trust", "#v3-03-context-card-aware"];
    CARDS.forEach(function (sel, i) {

    /* --- B. spotlight synced to narration --- */
    var RING_ON = "0 0 0 3px #0A3D91, 0 14px 32px rgba(10,61,145,0.18)";
    var RING_OFF = "0 0 0 0px rgba(10,61,145,0), 0 0 0 0px rgba(10,61,145,0)";
    // the payoff pill is solid cobalt: its ring sits outside a white gap so it reads on blue
    var PILL_ON = "0 0 0 4px #FFFFFF, 0 0 0 7px #0A3D91, 0 14px 32px rgba(10,61,145,0.22)";
    var PILL_OFF = "0 0 0 0px rgba(255,255,255,0), 0 0 0 0px rgba(10,61,145,0), 0 0 0 0px rgba(10,61,145,0)";
    var BASE_BG = "rgba(10,61,145,0.04)";
    var ON_BG = "rgba(10,61,145,0.08)";
    var PILL = "#v3-03-context-payoff";
    CARDS.forEach(function (sel) { tl.set(sel, { boxShadow: RING_OFF, backgroundColor: BASE_BG }, 0); });
    tl.set(PILL, { boxShadow: PILL_OFF }, 0);

    // idx 0..3 → that card; idx -1 → rest (all cards normal) with the payoff pill spotlighted
    function spot(idx, at) {
      CARDS.forEach(function (sel, i) {
        var on = i === idx, rest = idx < 0;
        tl.to(sel, {
          opacity: on || rest ? 1 : 0.4, scale: on ? 1.03 : 1,
          boxShadow: on ? RING_ON : RING_OFF, backgroundColor: on ? ON_BG : BASE_BG,
          duration: 0.35, ease: "power2.out"
        }, at);
      });
      var pay = idx < 0;
      tl.to(PILL, {
        opacity: pay ? 1 : 0.4, scale: pay ? 1.03 : 1, boxShadow: pay ? PILL_ON : PILL_OFF,
        duration: 0.35, ease: "power2.out"
      }, at);

    spot(0, CUE.c1);   // "ngăn thiệt hại"
    spot(1, CUE.c2);   // "giữ sản xuất"
    spot(2, CUE.c3);   // "giữ niềm tin"
    spot(3, CUE.c4);   // "hiểu tầm quan trọng"
    spot(-1, CUE.pay); // "để tuân thủ" → recap + payoff pill

    // payoff: blue fill rises in the shield, SEMV turns white (hub stays in place)
    var rise = [byId("v3-03-context-rise"), byId("v3-03-context-rise-mask")];
    tl.fromTo(rise, { attr: { y: 76 } }, { attr: { y: -2 }, duration: 1.4, ease: "power1.inOut" }, CUE.pay);
