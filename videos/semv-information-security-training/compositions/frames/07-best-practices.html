<script>
(function () {
  var FID = "07-best-practices";
  var $ = function (id) { return document.getElementById("bp07-" + id); };

  // ---- Scene 1 (0.0–2.1s): slide-header -------------------------------
  tl.fromTo($("eyebrow"), { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" }, 0.05);
  var words = $("h2").getElementsByClassName(FID + "-word");
  for (var w = 0; w < words.length; w++) {
    tl.fromTo(words[w], { opacity: 0, y: 34 }, { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" }, 0.2 + w * 0.09);
  }
  // pill pops on "chính bạn"
  tl.fromTo($("pill"), { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.5, ease: "power3.out" }, 1.4);

  // empty 2-col grid region established: ghost slots stagger in
  var cueTimes = [2.2, 3.4, 4.6, 7.0, 8.7, 10.1, 11.4];
  for (var g = 0; g < 7; g++) {
    var ghost = $("slot" + (g + 1)).getElementsByClassName(FID + "-ghost")[0];
    tl.fromTo(ghost, { opacity: 0, scale: 0.97 }, { opacity: 1, scale: 1, duration: 0.45, ease: "power2.out" }, 0.7 + g * 0.08);
    // the card covers its ghost as it lands
    tl.to(ghost, { opacity: 0, duration: 0.3, ease: "power1.out" }, cueTimes[g] + 0.25);
  }

  // ---- Scene 2 (2.2–10.0s) + Scene 3 entrance: grid-card-assemble -------
  for (var i = 0; i < 7; i++) {
    var slot = $("slot" + (i + 1));
    var card = slot.getElementsByClassName(FID + "-card")[0];
    var num = slot.getElementsByClassName(FID + "-num")[0];
    var ico = slot.getElementsByClassName(FID + "-ico")[0];
    var label = slot.getElementsByClassName(FID + "-label")[0];
    var t = cueTimes[i];
    tl.fromTo(card, { opacity: 0, y: 36, scale: 0.96 }, { opacity: 1, y: 0, scale: 1, duration: 0.6, ease: "power3.out" }, t);
    tl.fromTo(num, { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.5, ease: "power3.out" }, t + 0.1);
    tl.fromTo(ico, { scale: 0.5, rotation: -12, opacity: 0 }, { scale: 1, rotation: 0, opacity: 1, duration: 0.55, ease: "power3.out" }, t + 0.18);
    tl.fromTo(label, { opacity: 0, x: -18 }, { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" }, t + 0.22);
  }

  // ---- Scene 3 (11.2–12.9s): card 7 floods solid blue on "khóa máy" ----
  tl.fromTo($("sweep"), { scaleX: 0 }, { scaleX: 1, duration: 0.55, ease: "power2.inOut" }, 11.6);
  tl.fromTo($("card7"), { borderColor: "rgba(10, 61, 145, 0.2)" }, { borderColor: "rgba(10, 61, 145, 1)", duration: 0.4, ease: "power1.out" }, 11.65);

  tl.fromTo($("num7"), { backgroundColor: "#0A3D91", color: "#FFFFFF" }, { backgroundColor: "#FFFFFF", color: "#0A3D91", duration: 0.35, ease: "power1.out" }, 11.75);


  // ---- Hold: slow camera push-in under the assemble, quiet in Scene 4 ----
  tl.fromTo($("stage"), { scale: 1 }, { scale: 1.015, duration: 14.04 - 2.2, ease: "none" }, 2.2);

  window.__timelines = window.__timelines || {};
  window.__timelines[FID] = tl;
})();
