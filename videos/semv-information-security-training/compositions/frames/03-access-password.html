<script>
(function () {
  var FID = "03-access-password";
  var DUR = 16.224;
  var root = document.querySelector('[data-composition-id="' + FID + '"]');
  var $ = function (s) { return root.querySelector(s); };
  var $$ = function (s) { return root.querySelectorAll(s); };

  window.__timelines = window.__timelines || {};
  var tl = gsap.timeline({ paused: true });

  // ---- macro camera: slow steady push-in under the whole shot ----
  tl.fromTo($("#ap03-world"), { scale: 1 }, { scale: 1.02, duration: DUR, ease: "none" }, 0);


  // ---- Scene 1 (0.0–2.2s): slide-header + level label ----
  tl.fromTo($("#ap03-eyebrow"), { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" }, 0.05);
  tl.fromTo($("#ap03-h2"), { opacity: 0, y: 28 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 0.15);
  tl.fromTo($("#ap03-levels-label"), { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" }, 1.3);

  // ---- Scene 2 (2.3–3.6s): A · B · C assemble into their slots on each spoken letter ----
  var levels = [["#ap03-lvA", 2.3], ["#ap03-lvB", 2.8], ["#ap03-lvC", 3.4]];
  levels.forEach(function (l) {
    tl.fromTo($(l[0]), { opacity: 0, y: 26, scale: 0.94 }, { opacity: 1, y: 0, scale: 1, duration: 0.5, ease: "power3.out" }, l[1]);
  });
  tl.fromTo($("#ap03-who"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 3.4);

  // ---- Scene 3 (5.4–7.0s): ban card + self-drawing prohibition icon ----
  tl.fromTo($("#ap03-ban"), { opacity: 0, y: 22 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 5.4);
  var ring = $("#ap03-ban-ring"), slash = $("#ap03-ban-slash");
  var rLen = ring.getTotalLength ? ring.getTotalLength() : 60;
  var sLen = slash.getTotalLength ? slash.getTotalLength() : 19;
  tl.fromTo(ring, { strokeDasharray: rLen, strokeDashoffset: rLen }, { strokeDashoffset: 0, duration: 0.6, ease: "power2.out" }, 5.5);
  tl.fromTo(slash, { strokeDasharray: sLen, strokeDashoffset: sLen }, { strokeDashoffset: 0, duration: 0.35, ease: "power2.out" }, 5.95);
  // "không cho mượn" lights up on its cue
  tl.fromTo($("#ap03-lend"), { color: "#9A9A9A" }, { color: "#0F172A", duration: 0.4, ease: "power1.out" }, 6.4);
  tl.fromTo($("#ap03-lend-line"), { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power2.out" }, 6.45);

  // ---- Scene 4 (8.1–9.4s): password card slides in from the right, types itself ----
  tl.fromTo($("#ap03-card"), { opacity: 0, x: 220 }, { opacity: 1, x: 0, duration: 0.8, ease: "expo.out" }, 8.1);

  var typedEl = $("#ap03-typed");
  var caretEl = $("#ap03-caret");
  var PASS = "S•••••••@7k";
  var TYPE_START = 8.35, KEY_GAP = 0.06;
  var SEQ = [{ t: 0, text: "" }];
  for (var i = 1; i <= PASS.length; i++) SEQ.push({ t: TYPE_START + i * KEY_GAP, text: PASS.slice(0, i) });
  function textAt(t) {
    for (var k = SEQ.length - 1; k >= 0; k--) if (t >= SEQ[k].t) return SEQ[k].text;
    return "";
  }
  var driver = { t: 0 };
  tl.fromTo(driver, { t: 0 }, {
    t: DUR, duration: DUR, ease: "none",
    onUpdate: function () { typedEl.textContent = textAt(driver.t); }
  }, 0);
  // caret: deterministic finite square-wave blink (one cycle ≈ 0.7s), solid while typing
  var CARET_START = 8.1;
  var blink = { p: 0 };
  var BLINK_DUR = DUR - CARET_START;
  var CYCLES = Math.round(BLINK_DUR / 0.7);
  tl.fromTo(blink, { p: 0 }, {
    p: Math.PI * 2 * CYCLES, duration: BLINK_DUR, ease: "none",
    onUpdate: function () {
      var t = CARET_START + (blink.p / (Math.PI * 2 * CYCLES)) * BLINK_DUR;
      var typing = t < TYPE_START + PASS.length * KEY_GAP + 0.1;
      caretEl.style.opacity = (typing || Math.cos(blink.p) > 0) ? "1" : "0";
    }
  }, CARET_START);

  // criteria list fades in quietly (unchecked) with the card
  tl.fromTo($$(".ap03-crit"), { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out", stagger: 0.05 }, 8.5);

  // ---- ticks + stepped strength fill (Scene 4 "8" tick, Scene 5 the rest) ----
  var fill = $("#ap03-fill");
  var pctEl = $("#ap03-meter-pct");
  tl.set(fill, { scaleX: 0 }, 0);
  var meter = { v: 0 };

  var ticks = [
    ["#ap03-c5", 9.0, 0.2, "#0A3D91"],
    ["#ap03-c1", 10.3, 0.4, "#0F172A"],
    ["#ap03-c2", 11.1, 0.6, "#0F172A"],
    ["#ap03-c3", 11.9, 0.8, "#0F172A"],
    ["#ap03-c4", 12.6, 1.0, "#0F172A"]
  ];
  var prev = 0;
  ticks.forEach(function (tk) {
    var row = $(tk[0]);
    var dot = row.querySelector(".ap03-dot");
    var chk = row.querySelector(".ap03-check");
    var cLen = chk.getTotalLength ? chk.getTotalLength() : 16;
    var at = tk[1];
    tl.fromTo(dot, { scale: 0, opacity: 0, transformOrigin: "50% 50%" }, { scale: 1, opacity: 1, transformOrigin: "50% 50%", duration: 0.3, ease: "back.out(2)" }, at - 0.05);
    tl.fromTo(chk, { strokeDasharray: cLen, strokeDashoffset: cLen }, { strokeDashoffset: 0, duration: 0.3, ease: "power2.out" }, at + 0.1);
    tl.fromTo(row.querySelector("span"), { color: "#9A9A9A" }, { color: tk[3], duration: 0.3, ease: "power1.out" }, at);
    tl.fromTo(fill, { scaleX: prev }, { scaleX: tk[2], duration: 0.5, ease: "power2.out", immediateRender: false }, at);
    tl.fromTo(meter, { v: prev * 100 }, {
      v: tk[2] * 100, duration: 0.5, ease: "power2.out", immediateRender: false,
      onUpdate: function () { pctEl.textContent = Math.round(meter.v) + "%"; }
    }, at);
    prev = tk[2];
  });

  // ---- Scene 6 (13.8–16.22s): rotation pill lands on "ba tháng", smooth settle, hold ----
  tl.fromTo($("#ap03-pill"), { opacity: 0, y: -14, scale: 0.94 }, { opacity: 1, y: 0, scale: 1, duration: 0.7, ease: "power3.out" }, 14.4);

  // hold to end
  tl.set({}, {}, DUR);

  window.__timelines[FID] = tl;
})();
</script>
