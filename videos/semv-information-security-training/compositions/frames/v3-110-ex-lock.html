      }
      var MI = "v3-110-ex-lock-mi", SR = "v3-110-ex-lock-sr";

      var m = { o: P + "minh", f: "#" + MI + "-flip", lf: "#" + MI + "-legF", lb: "#" + MI + "-legB", af: "#" + MI + "-armF", ab: "#" + MI + "-armB", head: "#" + MI + "-head", desk: "#" + MI + "-adesk" };

      // ---------- camera ----------
