  // "không chia sẻ" / "không cho mượn"
  // left card stays active as the container (ring moves to the rule rows); right card stays dimmed
  tl.to($(P + "cardL"), { scale: 1, boxShadow: RING_OFF, backgroundColor: CARDS[0][1], duration: 0.35, ease: "power2.out" }, CUE.b1);
  spot(LEFT, 0, CUE.b1);
  spot(LEFT, 1, CUE.b2);
  // "Mật khẩu phải đổi ba tháng một lần" → right card active, rotate chip lit
  spot(LEFT, -1, CUE.pw);
  tl.to($(P + "cardL"), { opacity: 0.4, duration: 0.35, ease: "power2.out" }, CUE.pw);
  tl.to($(P + "cardR"), { opacity: 1, duration: 0.35, ease: "power2.out" }, CUE.pw);
  spot(RIGHT, 0, CUE.pw);

  // requirements: spotlight + tick + strength step on each spoken requirement
  var fill = $(P + "fill");
  tl.set(fill, { scaleX: 0 }, 0);
  ["r1", "r2", "r3", "r4", "r5"].forEach(function (name, k) {
    var at = CUE[name];
    var row = $(P + "c" + (k + 1));
    var dot = row.querySelector(".v3-04-access-dot");
    var chk = row.querySelector(".v3-04-access-check");
    var cLen = (chk.getTotalLength ? chk.getTotalLength() : 16) * 1.05 + 1;
    spot(RIGHT, k + 1, at);
    tl.set(dot, { scale: 0, opacity: 0, transformOrigin: "50% 50%" }, 0);
    tl.set(chk, { strokeDasharray: cLen, strokeDashoffset: cLen }, 0);
    tl.to(dot, { scale: 1, opacity: 1, duration: 0.3, ease: "power2.out" }, at);
    tl.to(chk, { strokeDashoffset: 0, duration: 0.25, ease: "power2.out" }, at + 0.12);
    tl.to(row.querySelector("span"), { color: "#0F172A", duration: 0.3, ease: "power1.out" }, at);
    tl.to(fill, { scaleX: (k + 1) / 5, duration: 0.4, ease: "power2.out" }, at);
  });

  // rest: recap view, everything normal
  spot(CARDS, -1, CUE.rest);
  spot(RIGHT, -1, CUE.rest);

  tl.set({}, {}, DURATION);

  window.__timelines[FID] = tl;
})();
</script>
