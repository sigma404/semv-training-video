        }

        tl.fromTo($("sum"), { opacity: 0, x: -10 }, { opacity: 1, x: 0, duration: 0.3, ease: "power2.out", immediateRender: false }, CALC1);

        var A = Math.max(C.ask, CALC1 + 0.05), end = C.now - 0.25;

        pop($("q2"), A + 1.52 * u);
        walk("lead", STOPS[2], A + 1.7 * u, 0.5 * u);
        pop($("q3"), A + 2.22 * u);
        face("lead", "frown", A + 1.6 * u);
        look("lead", -7, A + 2.25 * u);

        var W = C.now - 0.1, WD = 0.7;
        tl.to($("b"), { clipPath: "inset(0px 0px 0px 0px)", duration: WD, ease: "power2.inOut" }, W);
        tl.to($("edge"), { opacity: 1, duration: 0.1, ease: "none" }, W);
        tl.to($("edge"), { x: 1940, duration: WD, ease: "power2.inOut" }, W);
        tl.to($("edge"), { opacity: 0, duration: 0.15, ease: "none" }, W + WD - 0.1);
        tl.to($("pillB"), { opacity: 0, duration: 0.15, ease: "none" }, W + 0.1);
        tl.fromTo($("pillA"), { opacity: 0, x: -16 }, { opacity: 1, x: 0, duration: 0.3, ease: "power2.out", immediateRender: false }, W + 0.28);
        tl.to($("a"), { opacity: 0, duration: 0.05, ease: "none" }, W + WD + 0.05);

        [1, 2, 3].forEach(function (i) {
          tl.fromTo($("s" + i), { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.45, ease: "power2.out", immediateRender: false }, W + 0.45 + i * 0.1);
        });
        tl.fromTo($("win"), { scale: 0.97 }, { scale: 1, duration: 0.6, ease: "power2.out", immediateRender: false }, W + 0.3);

        // record chips: each station → the report ("số liệu được ghi nhận vào MES")
        var CH0 = W + 0.95, CHS = Math.max(0.2, (C.open - 0.6 - CH0) / NCH);
        chips.forEach(function (el, i) {
          var s = i % 3, at = CH0 + i * CHS;
          tl.set(el, { x: STAT_OUT[s][0], y: STAT_OUT[s][1], opacity: 1, scale: 1 }, at);
          tl.to(el, { x: INTO[s][0], y: INTO[s][1], duration: 0.5, ease: "power1.inOut" }, at);
          tl.to(el, { opacity: 0, scale: 0.6, duration: 0.15, ease: "none" }, at + 0.5);
          tl.to($("s" + (s + 1)), { keyframes: { scale: [1, 1.03, 1] }, duration: 0.3, ease: "none" }, at);
        });

        // "sản lượng"
        var O = C.output;
        tl.to($("k1"), { keyframes: { scale: [1, 1.03, 1] }, duration: 0.45, ease: "none" }, O);
        tl.to($("outbar"), { scaleX: 0.96, duration: 1.2, ease: "power2.out" }, OUT0);

        // "tiến độ từng lô"
        var LT = C.lots, PCTS = [1, 0.76, 0.38, 0.24];
        [1, 2, 3, 4].forEach(function (i) {
          var row = $("row" + i), at = LT + (i - 1) * 0.18;
          tl.to(row.querySelector("." + PX + "fill"), { scaleX: PCTS[i - 1], duration: 0.6, ease: "power2.out" }, at);
          tl.to(row.querySelectorAll("." + PX + "pct, ." + PX + "eta, ." + PX + "stw"), { opacity: 1, duration: 0.3, ease: "none" }, at + 0.35);
        });
        tl.to($("row3"), { backgroundColor: "rgba(245,158,11,0.08)", duration: 0.3, ease: "none" }, LT + 0.8);

        // "tỷ lệ đạt chất lượng"
        var Q = C.quality;
        tl.to($("k2"), { keyframes: { scale: [1, 1.03, 1] }, duration: 0.45, ease: "none" }, Q);
        tl.to($("arc"), { strokeDashoffset: 351.9 * (1 - 0.986), duration: 1.1, ease: "power2.out" }, QR0);

        // "Quản lý chỉ cần mở MES Report": stations step aside, the manager comes to his desk
        var P = C.open;
        [1, 2, 3].forEach(function (i) { tl.to($("s" + i), { opacity: 0, x: -40, duration: 0.35, ease: "power2.in" }, P - 0.3 + (i - 1) * 0.06); });
        walk("mgr", MGR_X, P, 1.0);
        look("mgr", 7, P + 1.0);
        tl.to($("win"), { keyframes: { scale: [1, 1.012, 1] }, duration: 0.4, ease: "none" }, P + 1.1);
        blink("mgr", P + 1.6);

        // "nắm được tình hình": the late lot is spotlighted
        var G = C.grasp;
        var DIM = [$("k1"), $("k2"), $("row1"), $("row2"), $("row4")];
        tl.to($("cursor"), { opacity: 1, duration: 0.2, ease: "none" }, G - 0.4);
        tl.to($("cursor"), { x: ROW3[0], y: ROW3[1], duration: 0.6, ease: "power2.inOut" }, G - 0.3);
        tl.to(DIM, { opacity: 0.4, duration: 0.35, ease: "power2.out" }, G);
        tl.to($("row3"), { scale: 1.02, boxShadow: "0 0 0 3px #F59E0B, 0 12px 28px rgba(245,158,11,0.25)", backgroundColor: "rgba(245,158,11,0.12)", duration: 0.35, ease: "power2.out" }, G);
        tl.to(part("mgr", "brows"), { y: -4, duration: 0.2, ease: "power2.out" }, G + 0.1);
        tl.to(part("mgr", "head"), { rotation: 5, svgOrigin: PIV.head, duration: 0.3, ease: "power2.out" }, G + 0.1);

        // "điều chỉnh kế hoạch kịp thời": press the button, the lot is back on schedule
        var J = C.adjust;
        tl.to($("cursor"), { x: BTN[0], y: BTN[1], duration: 0.55, ease: "power2.inOut" }, J - 0.1);
        pose("mgr", "armR", -24, J, 0.3);
        tl.to($("btn"), { scale: 0.9, backgroundColor: "#DCE7F8", duration: 0.08, ease: "power1.in" }, J + 0.5);
        tl.to($("btn"), { scale: 1, backgroundColor: "#FFFFFF", duration: 0.2, ease: "back.out(2)" }, J + 0.58);
        tl.to($("cursor"), { opacity: 0, duration: 0.25, ease: "none" }, J + 0.9);
        var R3 = J + 0.75;
        tl.to($("fill3"), { backgroundColor: "#059669", duration: 0.35, ease: "none" }, R3);
        tl.to($("pct3"), { color: "#047857", duration: 0.35, ease: "none" }, R3);

        tl.fromTo($("eta3b"), { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.25, ease: "power2.out", immediateRender: false }, R3 + 0.15);
        tl.to($("st3a"), { opacity: 0, duration: 0.2, ease: "none" }, R3);
        tl.fromTo($("st3b"), { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(2.2)", immediateRender: false }, R3 + 0.1);
        tl.to($("row3"), { boxShadow: "0 0 0 3px #059669, 0 12px 28px rgba(5,150,105,0.2)", backgroundColor: "rgba(5,150,105,0.08)", duration: 0.35, ease: "power2.out" }, R3);
        pose("mgr", "armR", 0, R3 + 0.3, 0.35);
        tl.to(part("mgr", "head"), { rotation: 0, svgOrigin: PIV.head, duration: 0.3, ease: "power2.out" }, R3 + 0.2);
        tl.to(part("mgr", "brows"), { y: 0, duration: 0.2, ease: "power2.out" }, R3 + 0.2);
        face("mgr", "grin", R3 + 0.25);
        hop($("mgr"), R3 + 0.35, 10);
        tl.to(DIM, { opacity: 1, duration: 0.4, ease: "power2.out" }, R3 + 0.9);
        tl.to($("row3"), { scale: 1, duration: 0.4, ease: "power2.out" }, R3 + 0.9);

        // takeaway
        var T = Math.max(C.take, R3 + 0.6);
        tl.fromTo($("take"), { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out", immediateRender: false }, T);

        tl.set({}, {}, DURATION);
        window.__timelines["f107-ex-alert"] = tl;
      })();
