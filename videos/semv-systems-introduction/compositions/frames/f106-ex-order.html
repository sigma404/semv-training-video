          <div data-hf-id="hf-0sro" class="f106-ex-order-pill" id="f106-ex-order-pillA" data-layout-allow-overflow=""><svg data-hf-id="hf-tmee" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><ellipse data-hf-id="hf-hm8r" cx="12" cy="5.5" rx="7" ry="2.5" /><path data-hf-id="hf-qnyw" d="M5 5.5v13c0 1.4 3.1 2.5 7 2.5s7-1.1 7-2.5v-13" /><path data-hf-id="hf-iyu2" d="M5 12c0 1.4 3.1 2.5 7 2.5s7-1.1 7-2.5" /></svg><span data-hf-id="hf-ct8d">BÂY GIỜ · SAP</span></div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      (function () {
        var root = document.querySelector('[data-composition-id="f106-ex-order"]');
        var PX = "f106-ex-order-";
        var $ = function (id) { return root.querySelector("#" + PX + id); };
        var $$ = function (sel) { return Array.prototype.slice.call(root.querySelectorAll(sel)); };
        var part = function (who, p) { return root.querySelector("#" + PX + who + " ." + PX + p); };
        var CUE = /*hf-cues:start*/{"before":0,"report":2.34,"now":5.78,"enter":7.2,"stock":8.7,"plan":10.14,"cost":11.96,"once":14.14,"take":15.04}/*hf-cues:end*/;
        var DURATION = /*hf-dur:start*/18.726/*hf-dur:end*/;
        var C = Object.assign({ before: 0, report: 2.34, now: 5.78, enter: 7.2, stock: 8.7, plan: 10.14, cost: 11.96, once: 14.14, take: 15.04 }, CUE);
        var tl = gsap.timeline({ paused: true });

        // ---------- flat front-facing person (from the reference rig) ----------
        var SKIN = "#F6CDA8", SKIN2 = "#E8B48C";
        function person(o) {
          var s = '<svg viewBox="-160 -620 320 640">';
          if (o.hairStyle === "long") s += '<path d="M-72 -520 C-82 -606 82 -606 72 -520 L82 -410 C46 -392 -46 -392 -82 -410 Z" fill="' + o.hair + '" />';
          s += '<g class="' + PX + 'legL"><rect x="-44" y="-232" width="36" height="222" rx="16" fill="' + o.pants + '" /><ellipse cx="-30" cy="-8" rx="30" ry="12" fill="#1E293B" /></g>';
          s += '<g class="' + PX + 'legR"><rect x="8" y="-232" width="36" height="222" rx="16" fill="' + o.pants + '" /><ellipse cx="30" cy="-8" rx="30" ry="12" fill="#1E293B" /></g>';
          s += '<rect x="-17" y="-458" width="34" height="52" rx="10" fill="' + SKIN2 + '" />';
          s += '<path d="M-90 -214 C-96 -330 -86 -398 -34 -414 L34 -414 C86 -398 96 -330 90 -214 Z" fill="' + o.shirt + '" />';
          s += '<path d="M-26 -413 L0 -378 L26 -413 Z" fill="#FFFFFF" />';
          s += '<g class="' + PX + 'armL"><path d="M-74 -392 C-96 -350 -104 -300 -100 -238" stroke="' + o.arm + '" stroke-width="34" fill="none" stroke-linecap="round" /><circle cx="-100" cy="-226" r="18" fill="' + SKIN + '" /></g>';
          s += '<g class="' + PX + 'armR"><path d="M74 -392 C96 -350 104 -300 100 -238" stroke="' + o.arm + '" stroke-width="34" fill="none" stroke-linecap="round" /><circle cx="100" cy="-226" r="18" fill="' + SKIN + '" /></g>';
          s += '<g class="' + PX + 'head">';
          s += '<circle cx="-63" cy="-506" r="13" fill="' + SKIN2 + '" /><circle cx="63" cy="-506" r="13" fill="' + SKIN2 + '" />';
          s += '<circle cx="0" cy="-512" r="64" fill="' + SKIN + '" />';
          s += '<path d="M-66 -510 C-74 -588 -18 -602 10 -596 C58 -590 76 -556 66 -508 C52 -538 22 -548 -8 -546 C-34 -544 -56 -534 -66 -510 Z" fill="' + o.hair + '" />';
          s += '<path class="' + PX + 'brows" d="M-34 -542 Q-22 -536 -10 -540 M10 -540 Q22 -536 34 -542" stroke="#1E293B" stroke-width="5" fill="none" stroke-linecap="round" />';
          s += '<g class="' + PX + 'eyes"><ellipse cx="-22" cy="-510" rx="6.5" ry="9" fill="#0F172A" /><ellipse cx="22" cy="-510" rx="6.5" ry="9" fill="#0F172A" /></g>';
          s += '<circle cx="-38" cy="-486" r="10" fill="#F59E9E" opacity="0.45" /><circle cx="38" cy="-486" r="10" fill="#F59E9E" opacity="0.45" />';
          s += '<path class="' + PX + 'mouth" d="M-12 -472 Q0 -480 12 -472" stroke="#9A3412" stroke-width="4.5" fill="none" stroke-linecap="round" />';
          s += '</g></svg>';
          return s;
        }
        $("run").innerHTML = person({ shirt: "#64748B", arm: "#566375", hair: "#2B2B2B", hairStyle: "m", pants: "#334155" })
          + '<div class="' + PX + 'stack"><div class="' + PX + 'sh" id="' + PX + 'sh1" style="left:0;top:8px"></div><div class="' + PX + 'sh" id="' + PX + 'sh2" style="left:5px;top:5px"></div><div class="' + PX + 'sh" id="' + PX + 'sh3" style="left:10px;top:2px"></div><div class="' + PX + 'sh" id="' + PX + 'sh4" style="left:14px;top:0"></div></div>';

        var PIV = { armL: "-74 -392", armR: "74 -392", head: "0 -450", eyes: "0 -510" };
        function pose(who, p, rot, at, dur) { tl.to(part(who, p), { rotation: rot, svgOrigin: PIV[p], duration: dur || 0.4, ease: "power2.out" }, at); }
        function walk(who, toX, t0, dur) {
          var w = $(who), steps = Math.max(2, Math.round(dur / 0.22)), h = dur / steps;
          tl.to(w, { x: toX, duration: dur, ease: "power1.inOut" }, t0);
          for (var i = 0; i < steps; i++) {
            var t = t0 + i * h, leg = part(who, i % 2 ? "legR" : "legL");
            tl.to(w, { y: -10, duration: h / 2, ease: "sine.out" }, t);
            tl.to(w, { y: 0, duration: h / 2, ease: "sine.in" }, t + h / 2);
            tl.to(leg, { y: -22, duration: h / 2, ease: "sine.out" }, t);
            tl.to(leg, { y: 0, duration: h / 2, ease: "sine.in" }, t + h / 2);
          }
        }
        function look(who, dx, at) { tl.to(part(who, "eyes"), { x: dx, duration: 0.2, ease: "power2.out" }, at); }

        // ---------- layout constants ----------
        var BEFORE = [[95, 170, -2], [545, 186, 1.5], [995, 168, -1.2], [1445, 184, 2]];
        var AFTER = [[170, 130], [1370, 130], [1370, 540], [170, 540]];
        var PANELS = [1, 2, 3, 4].map(function (i) { return $("p" + i); });
        var HUB = [960, 485];
        var EDGE = [[550, 275], [1370, 275], [1370, 685], [550, 685]];
        var NEQ = [[510, 330], [960, 330], [1410, 330]];
        var SPOT = [285, 735, 1185, 1635];             // runner x under each island
        var HANDX = 55, HANDY = 736;                     // runner hand offset (scaled rig)

        // ---------- initial state ----------
        PANELS.forEach(function (p, i) { gsap.set(p, { x: BEFORE[i][0], y: BEFORE[i][1], rotation: BEFORE[i][2] }); });
        NEQ.forEach(function (q, i) { gsap.set($("neq" + (i + 1)), { x: q[0], y: q[1] }); });
        gsap.set($("run"), { x: -200, y: 0, scale: 0.55, transformOrigin: "50% 100%" });
        $$("." + PX + "after").forEach(function (el) { gsap.set(el, { opacity: 0 }); });
        gsap.set($("sale"), { clipPath: "inset(0% 100% 0% 0%)" });
        gsap.set([$("khosub"), $("chip2"), $("chip3"), $("chip4"), $("costsub")], { opacity: 0 });
        gsap.set($$("." + PX + "gb"), { scaleX: 0 });
        gsap.set($$("." + PX + "sh"), { opacity: 0 });
        gsap.set($$("." + PX + "fly"), { opacity: 0 });
        gsap.set($$("." + PX + "tok"), { opacity: 0, x: HUB[0], y: HUB[1] });
        gsap.set([$("pillA"), $("take"), $("hub"), $("ring"), $("hubcap")], { opacity: 0 });
        gsap.set($("nowbg"), { clipPath: "circle(0% at 50% 45%)" });
        var links = $$("." + PX + "link");
        links.forEach(function (el) { var len = 470; el.style.strokeDasharray = String(len); el.style.strokeDashoffset = String(len); });

        // ---------- counters computed from time (seek-safe) ----------
        var easeO = gsap.parseEase("power2.out");
        function vn(n) { return Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, "."); }
        var KHO0 = C.stock + 0.25, KHO1 = KHO0 + 1.0, COST0 = C.cost + 0.25, COST1 = COST0 + 1.1;
        var proxy = { t: 0 }, khoEl = $("kho"), costEl = $("cost");
        function prog(t, a, b) { return t <= a ? 0 : t >= b ? 1 : easeO((t - a) / (b - a)); }
        function render() {
          var t = proxy.t;
          khoEl.textContent = vn(1240 - 500 * prog(t, KHO0, KHO1));
          costEl.textContent = vn(182500000 * prog(t, COST0, COST1));
        }
        render();
        tl.to(proxy, { t: DURATION, duration: DURATION, ease: "none", onUpdate: render }, 0);

        // ================= TRƯỚC ĐÂY =================
        PANELS.forEach(function (p, i) {
          tl.fromTo(p, { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 0.45, ease: "back.out(1.6)" }, 0.15 + i * 0.15);
        });
        [1, 2, 3].forEach(function (i) {
          tl.fromTo($("neq" + i), { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(2.2)" }, 1.0 + (i - 1) * 0.2);
        });
        walk("run", SPOT[0], 0.3, 1.2);
        look("run", -6, 1.6);
        tl.to(part("run", "brows"), { y: -4, duration: 0.2, ease: "power2.out" }, 1.6);

        // runner collects a printout from each island (timed to fit between "report" and "now")
        var R = C.report, u = Math.max(0.3, (C.now - 0.6 - R) / 8), t = R;
        for (var k = 0; k < 4; k++) {
          var fl = $("fly" + (k + 1)), px = BEFORE[k][0] + 190, py = BEFORE[k][1] + 280;
          tl.set(fl, { x: px, y: py, opacity: 1, rotation: 0 }, t);
          tl.to(fl, { x: SPOT[k] + HANDX, y: HANDY, rotation: 14, duration: u * 0.85, ease: "power2.inOut" }, t);
          tl.set(fl, { opacity: 0 }, t + u * 0.85);
          tl.set($("sh" + (k + 1)), { opacity: 1 }, t + u * 0.85);
          tl.to(PANELS[k], { keyframes: { y: [BEFORE[k][1], BEFORE[k][1] - 8, BEFORE[k][1]] }, duration: 0.3, ease: "none" }, t);
          if (k > 0) tl.to($("neq" + k), { keyframes: { scale: [1, 1.25, 1] }, duration: 0.35, ease: "none" }, t + u * 0.5);
          if (k === 0) pose("run", "armR", -20, t, 0.25);
          look("run", k % 2 ? 6 : -6, t);
          t += u;
          if (k < 3) { walk("run", SPOT[k + 1], t, u * 1.33); t += u * 1.33; }
        }

        // ================= BÂY GIỜ =================
        var N = C.now;
        tl.to([$("run"), $("neq1"), $("neq2"), $("neq3"), $("isles")], { opacity: 0, duration: 0.3, ease: "power1.out" }, N - 0.15);
        tl.to($("floor"), { opacity: 0, duration: 0.5, ease: "none" }, N);
        tl.to($("pillB"), { opacity: 0, duration: 0.2, ease: "none" }, N);
        tl.fromTo($("pillA"), { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(2)", immediateRender: false }, N + 0.2);
        tl.to($("nowbg"), { clipPath: "circle(120% at 50% 45%)", duration: 1.0, ease: "power2.inOut" }, N);
        $$("." + PX + "before").forEach(function (el) { tl.to(el, { opacity: 0, duration: 0.25, ease: "none" }, N); });
        PANELS.forEach(function (p, i) {
          tl.to(p, { x: AFTER[i][0], y: AFTER[i][1], rotation: 0, backgroundColor: "#FFFFFF", borderColor: "rgba(10,61,145,0.25)", duration: 0.9, ease: "power3.inOut" }, N + 0.1 + i * 0.05);
          tl.to(p.querySelector("." + PX + "ph"), { backgroundColor: "rgba(10,61,145,0.08)", color: "#0A3D91", duration: 0.6, ease: "none" }, N + 0.2);
          tl.to(p.querySelector("." + PX + "after"), { opacity: 1, duration: 0.35, ease: "power1.out" }, N + 1.05 + i * 0.05);
        });
        tl.fromTo($("hub"), { opacity: 0, scale: 0.3 }, { opacity: 1, scale: 1, duration: 0.6, ease: "back.out(1.7)", immediateRender: false }, N + 0.6);
        tl.fromTo($("hubcap"), { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out", immediateRender: false }, N + 1.0);
        links.forEach(function (el, i) { tl.to(el, { strokeDashoffset: 0, duration: 0.45, ease: "power2.out" }, N + 0.95 + i * 0.06); });

        function ringPulse(at) {
          tl.fromTo($("ring"), { opacity: 0.8, scale: 1 }, { opacity: 0, scale: 1.45, duration: 0.7, ease: "power2.out", immediateRender: false }, at);
        }
        function token(k, from, to, at) {
          var el = $("tok" + k);
          tl.set(el, { x: from[0], y: from[1], opacity: 1, scale: 1 }, at);
          tl.to(el, { x: to[0], y: to[1], duration: 0.5, ease: "power1.inOut" }, at);
          tl.to(el, { opacity: 0, scale: 0.6, duration: 0.15, ease: "none" }, at + 0.5);
        }

        // order entered by Bán hàng → hub
        var E = C.enter;
        tl.to($("sale"), { clipPath: "inset(0% 0% 0% 0%)", duration: 0.5, ease: "power2.out" }, E);
        tl.to($("btn"), { keyframes: { scale: [1, 0.88, 1] }, duration: 0.3, ease: "none" }, E + 0.5);
        token(1, EDGE[0], HUB, E + 0.7);
        tl.to($("hub"), { keyframes: { scale: [1, 1.08, 1] }, duration: 0.35, ease: "none" }, E + 1.2);
        ringPulse(E + 1.2);

        // hub → Kho: live stock
        var S = C.stock;
        token(2, HUB, EDGE[1], S - 0.3);
        tl.fromTo($("khosub"), { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.35, ease: "power2.out", immediateRender: false }, S + 0.4);
        tl.fromTo($("chip2"), { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.35, ease: "power2.out", immediateRender: false }, S + 0.5);
        tl.to(PANELS[1], { keyframes: { scale: [1, 1.03, 1] }, duration: 0.4, ease: "none" }, S + 0.2);

        // hub → Sản xuất: plan bars
        var P = C.plan;
        token(3, HUB, EDGE[2], P - 0.3);
        $$("#" + PX + "p3 ." + PX + "gb").forEach(function (b, i) { tl.to(b, { scaleX: 1, duration: 0.45, ease: "power2.out" }, P + 0.2 + i * 0.25); });
        tl.fromTo($("chip3"), { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.35, ease: "power2.out", immediateRender: false }, P + 0.6);
        tl.to(PANELS[2], { keyframes: { scale: [1, 1.03, 1] }, duration: 0.4, ease: "none" }, P + 0.2);

        // hub → Kế toán: cost
        var K = C.cost;
        token(4, HUB, EDGE[3], K - 0.3);
        tl.fromTo($("costsub"), { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.35, ease: "power2.out", immediateRender: false }, K + 0.9);
        tl.fromTo($("chip4"), { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.35, ease: "power2.out", immediateRender: false }, K + 1.0);
        tl.to(PANELS[3], { keyframes: { scale: [1, 1.03, 1] }, duration: 0.4, ease: "none" }, K + 0.2);

        // "Một lần nhập" — everything pulses together, same order ID highlighted
        var O = C.once;
        var chips = $$("." + PX + "chip");
        tl.to(chips, { backgroundColor: "#0A3D91", color: "#FFFFFF", duration: 0.3, ease: "power1.out" }, O);
        PANELS.forEach(function (p) {
          tl.to(p, { keyframes: { scale: [1, 1.04, 1] }, duration: 0.6, ease: "none" }, O);
          tl.to(p, { boxShadow: "0 0 0 4px #0A3D91, 0 16px 36px rgba(10,61,145,0.22)", duration: 0.3, ease: "power2.out" }, O);
        });
        tl.to(links, { stroke: "#0A3D91", duration: 0.3, ease: "none" }, O);
        tl.to($("hub"), { keyframes: { scale: [1, 1.1, 1] }, duration: 0.5, ease: "none" }, O);
        ringPulse(O);
        ringPulse(O + 0.45);

        // takeaway
        var T = C.take;
        tl.fromTo($("take"), { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out", immediateRender: false }, T + 0.1);

        tl.set({}, {}, DURATION);
        window.__timelines["f106-ex-order"] = tl;
      })();
